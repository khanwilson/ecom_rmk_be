services:
  libs-builder:
    build:
      context: ./libs
      dockerfile: Dockerfile
    volumes:
      - ./libs:/usr/src/libs
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    command:
      [
        "redis-server",
        "--port",
        "6379",
        "--cluster-enabled",
        "yes",
        "--cluster-config-file",
        "nodes.conf",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis1_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -h redis-node-1 -p 6379 cluster info | grep 'cluster_state:ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    command:
      [
        "redis-server",
        "--port",
        "6379",
        "--cluster-enabled",
        "yes",
        "--cluster-config-file",
        "nodes.conf",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6380:6379"
    volumes:
      - redis2_data:/data
    restart: unless-stopped

  redis-node-3:
    image: redis:7-alpine
    container_name: redis-node-3
    command:
      [
        "redis-server",
        "--port",
        "6379",
        "--cluster-enabled",
        "yes",
        "--cluster-config-file",
        "nodes.conf",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6381:6379"
    volumes:
      - redis3_data:/data
    restart: unless-stopped

  redis-node-4:
    image: redis:7-alpine
    container_name: redis-node-4
    command:
      [
        "redis-server",
        "--port",
        "6379",
        "--cluster-enabled",
        "yes",
        "--cluster-config-file",
        "nodes.conf",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6382:6379"
    volumes:
      - redis4_data:/data
    restart: unless-stopped

  redis-node-5:
    image: redis:7-alpine
    container_name: redis-node-5
    command:
      [
        "redis-server",
        "--port",
        "6379",
        "--cluster-enabled",
        "yes",
        "--cluster-config-file",
        "nodes.conf",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6383:6379"
    volumes:
      - redis5_data:/data
    restart: unless-stopped

  redis-node-6:
    image: redis:7-alpine
    container_name: redis-node-6
    command:
      [
        "redis-server",
        "--port",
        "6379",
        "--cluster-enabled",
        "yes",
        "--cluster-config-file",
        "nodes.conf",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6384:6379"
    volumes:
      - redis6_data:/data
    restart: unless-stopped

  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    entrypoint: [
        "sh",
        "-c",
        "sleep 5; \
        if redis-cli -h redis-node-1 -p 6379 cluster info | grep -q 'cluster_state:ok'; then \
        echo 'Cluster already exists and is OK. Skipping creation.'; \
        exit 0; \
        else \
        echo 'Attempting to create...'; \
        redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 redis-node-4:6379 redis-node-5:6379 redis-node-6:6379 --cluster-replicas 1 --cluster-yes; \
        fi",
      ]
    volumes:
      - redis_cluster_data:/data
    restart: "no"

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode configuration (no Zookeeper needed)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # port for kafka 9092 (Docker), 9093 (Controller), 9094 (Mac)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # KAFKA_NUM_NETWORK_THREADS: 3
      # KAFKA_NUM_IO_THREADS: 8
      # KRaft cluster ID (randomly generated, keep consistent)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
      - kafka_config:/mnt/shared/config
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

  # MongoDB Replica Set - Primary Node
  mongodb-primary:
    image: mongo:7.0
    container_name: mongodb-primary
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_primary_data:/data/db
      - mongodb_primary_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mongodb-replica

  # MongoDB Replica Set - Secondary Node 1
  mongodb-secondary-1:
    image: mongo:7.0
    container_name: mongodb-secondary-1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongodb_secondary1_data:/data/db
      - mongodb_secondary1_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mongodb-replica

  # MongoDB Replica Set - Secondary Node 2
  mongodb-secondary-2:
    image: mongo:7.0
    container_name: mongodb-secondary-2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongodb_secondary2_data:/data/db
      - mongodb_secondary2_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mongodb-replica

  # MongoDB Replica Set Initialization
  mongodb-replica-init:
    image: mongo:7.0
    container_name: mongodb-replica-init
    depends_on:
      mongodb-primary:
        condition: service_healthy
      mongodb-secondary-1:
        condition: service_healthy
      mongodb-secondary-2:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        sleep 10;
        mongosh --host mongodb-primary:27017 --eval "
          try {
            const status = rs.status();
            if (status.ok === 1) {
              print('Replica set already initialized');
              exit(0);
            }
          } catch (e) {
            print('Initializing replica set...');
            rs.initiate({
              _id: 'rs0',
              members: [
                { _id: 0, host: 'mongodb-primary:27017', priority: 2 },
                { _id: 1, host: 'mongodb-secondary-1:27017', priority: 1 },
                { _id: 2, host: 'mongodb-secondary-2:27017', priority: 1 }
              ]
            });
            print('Replica set initialized successfully');
          }
        "
    networks:
      - mongodb-replica
    volumes:
      - mongodb_replica_config:/data/configdb
      - mongodb_replica_data:/data/db
    restart: "no"

  identity-service:
    build:
      context: .
      dockerfile: ./identity/Dockerfile.dev
    container_name: identity-service
    env_file:
      - ./.env
    ports:
      - "${IDENTITY_PORT}:${IDENTITY_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
      libs-builder:
        condition: service_started
      redis-node-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_started
      mongodb-primary:
        condition: service_healthy
      mongodb-replica-init:
        condition: service_completed_successfully
    volumes:
      - ./libs:/usr/src/libs
      - ./identity/src:/usr/src/identity/src
      - ./identity/kafka:/usr/src/identity/kafka
      - ./identity/prisma:/usr/src/identity/prisma
      - ./identity/modules:/usr/src/identity/modules
      - ./identity/utils:/usr/src/identity/utils
      - identity_node_modules:/usr/src/identity/node_modules

  product-service:
    build:
      context: .
      dockerfile: ./product/Dockerfile.dev
    container_name: product-service
    env_file:
      - ./.env
    ports:
      - "${PRODUCT_PORT}:${PRODUCT_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
      libs-builder:
        condition: service_started
      redis-node-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_started
      mongodb-primary:
        condition: service_healthy
      mongodb-replica-init:
        condition: service_completed_successfully
    volumes:
      - ./libs:/usr/src/libs
      - ./product/src:/usr/src/product/src
      - ./product/kafka:/usr/src/product/kafka
      - ./product/prisma:/usr/src/product/prisma
      - ./product/modules:/usr/src/product/modules
      - ./product/utils:/usr/src/product/utils
      - product_node_modules:/usr/src/product/node_modules

  user-service:
    build:
      context: .
      dockerfile: ./user/Dockerfile.dev
    container_name: user-service
    env_file:
      - ./.env
    ports:
      - "${USER_PORT}:${USER_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
      libs-builder:
        condition: service_started
      redis-node-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_started
      mongodb-primary:
        condition: service_healthy
      mongodb-replica-init:
        condition: service_completed_successfully
    volumes:
      - ./libs:/usr/src/libs
      - ./user/src:/usr/src/user/src
      - ./user/kafka:/usr/src/user/kafka
      - ./user/prisma:/usr/src/user/prisma
      - ./user/modules:/usr/src/user/modules
      - ./user/utils:/usr/src/user/utils
      - user_node_modules:/usr/src/user/node_modules

  shop-service:
    build:
      context: .
      dockerfile: ./shop/Dockerfile.dev
    container_name: shop-service
    env_file:
      - ./.env
    ports:
      - "${SHOP_PORT}:${SHOP_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
      libs-builder:
        condition: service_started
      redis-node-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_started
      mongodb-primary:
        condition: service_healthy
      mongodb-replica-init:
        condition: service_completed_successfully
    volumes:
      - ./libs:/usr/src/libs
      - ./shop/src:/usr/src/shop/src
      - ./shop/kafka:/usr/src/shop/kafka
      - ./shop/prisma:/usr/src/shop/prisma
      - ./shop/modules:/usr/src/shop/modules
      - ./shop/utils:/usr/src/shop/utils
      - shop_node_modules:/usr/src/shop/node_modules

networks:
  mongodb-replica:
    driver: bridge

volumes:
  kafka_data:
  kafka_secrets:
  kafka_config:
  redis1_data:
  redis2_data:
  redis3_data:
  redis4_data:
  redis5_data:
  redis6_data:
  redis_cluster_data:
  mongodb_replica_data:
  mongodb_replica_config:
  mongodb_primary_data:
  mongodb_primary_config:
  mongodb_secondary1_data:
  mongodb_secondary1_config:
  mongodb_secondary2_data:
  mongodb_secondary2_config:
  identity_node_modules:
  product_node_modules:
  user_node_modules:
  shop_node_modules: