services:
  root-deps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-deps
    volumes:
      - .:/usr/src/app
      - root_node_modules:/usr/src/app/node_modules
    command: tail -f /dev/null
    restart: "no"

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # KAFKA_NUM_NETWORK_THREADS: 3
      # KAFKA_NUM_IO_THREADS: 8
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
      - kafka_config:/mnt/shared/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--appendonly", "yes"]
    volumes:
      - redis1_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis-node-1 -p 6379 cluster info | grep 'cluster_state:ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--appendonly", "yes"]
    volumes:
      - redis2_data:/data
    restart: unless-stopped

  redis-node-3:
    image: redis:7-alpine
    container_name: redis-node-3
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--appendonly", "yes"]
    volumes:
      - redis3_data:/data
    restart: unless-stopped

  redis-node-4:
    image: redis:7-alpine
    container_name: redis-node-4
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--appendonly", "yes"]
    volumes:
      - redis4_data:/data
    restart: unless-stopped

  redis-node-5:
    image: redis:7-alpine
    container_name: redis-node-5
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--appendonly", "yes"]
    volumes:
      - redis5_data:/data
    restart: unless-stopped

  redis-node-6:
    image: redis:7-alpine
    container_name: redis-node-6
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--appendonly", "yes"]
    volumes:
      - redis6_data:/data
    restart: unless-stopped

  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    entrypoint: [
      "sh", "-c",
      "sleep 5; \
       if redis-cli -h redis-node-1 -p 6379 cluster info | grep -q 'cluster_state:ok'; then \
         echo 'Cluster already exists and is OK. Skipping creation.'; \
         exit 0; \
       else \
         echo 'Attempting to create...'; \
         redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 redis-node-4:6379 redis-node-5:6379 redis-node-6:6379 --cluster-replicas 1 --cluster-yes; \
       fi"
    ]
    volumes:
      - redis_cluster_data:/data
    restart: "no"

  identity-service:
    build:
      context: ./src/services/identity
      dockerfile: Dockerfile.prod
      args:
        - DB_URI=${DB_URI}
    container_name: identity-service
    env_file:
      - .env.prod
      - src/services/identity/.env.prod
    ports:
      - "${IDENTITY_PORT:-3100}:${IDENTITY_PORT:-3100}"
    depends_on:
      root-deps:
        condition: service_started
      kafka:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_started
    environment:
      - NODE_ENV=prod
      - DB_URI=${DB_URI}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - REDIS_CLUSTER_NODES=${REDIS_CLUSTER_NODES}
      - IDENTITY_PORT=${IDENTITY_PORT:-3100}
    restart: unless-stopped

volumes:
  root_node_modules:
  kafka_data:
  kafka_secrets:
  kafka_config:
  redis1_data:
  redis2_data:
  redis3_data:
  redis4_data:
  redis5_data:
  redis6_data:
  redis_cluster_data: